# =============================================================================
# Prometheus scrape configuration for SecureScore
#
# Scrapes the SecureScore API on its /metrics endpoint every 15 seconds.
# The API exposes all nine custom application metrics plus the default
# Node.js process metrics provided by prom-client.
#
# In the CI compose stack the API container is reachable at the service name
# "api" on port 3000 (the internal port, not the published staging port).
# =============================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

  external_labels:
    environment: staging
    application: securescore

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: securescore-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:3000]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: securescore-api
