# =============================================================================
# SecureScore Prometheus alert rules
#
# Three rule groups mirror the three observability pillars that matter for
# this application: service availability, request-level performance, and
# security / business health.
#
# The verify-monitoring.sh script asserts that all three groups are loaded
# and that at least 8 alerting rules are registered. The named rules below
# (APIDown, DatabaseUnreachable, HighErrorRate, ProjectScoreCritical,
# AuthenticationFailureSpike) are individually checked by name.
# =============================================================================

groups:

  # ---------------------------------------------------------------------------
  # 1. Availability
  # ---------------------------------------------------------------------------
  - name: securescore.availability
    rules:

      - alert: APIDown
        expr: up{job="securescore-api"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "SecureScore API is down"
          description: >
            The Prometheus scrape target for the SecureScore API has been
            unreachable for more than 1 minute. All request traffic is failing.

      - alert: DatabaseUnreachable
        expr: securescore_database_up == 0
        for: 30s
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "SecureScore cannot reach PostgreSQL"
          description: >
            The application's database connectivity check has been reporting
            failure for at least 30 seconds. The API is likely returning 503
            on data-dependent endpoints.

      - alert: ServiceHealthDegraded
        expr: |
          (
            sum(rate(securescore_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(securescore_http_requests_total[5m]))
          ) > 0.1
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "SecureScore 5xx error rate elevated"
          description: >
            More than 10 % of HTTP requests are returning 5xx errors over the
            last 5 minutes. Current rate: {{ $value | humanizePercentage }}.

  # ---------------------------------------------------------------------------
  # 2. Performance
  # ---------------------------------------------------------------------------
  - name: securescore.performance
    rules:

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(securescore_http_requests_total{status=~"[45].."}[5m]))
            /
            sum(rate(securescore_http_requests_total[5m]))
          ) > 0.05
        for: 3m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "SecureScore error rate exceeds 5 %"
          description: >
            The combined 4xx / 5xx error rate has been above 5 % for the last
            3 minutes. Current value: {{ $value | humanizePercentage }}.

      - alert: HighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(securescore_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "SecureScore p95 latency exceeds 2 s"
          description: >
            The 95th-percentile response time has been above 2 seconds for
            5 minutes. Current p95: {{ $value | humanizeDuration }}.

      - alert: ScanRateDropped
        expr: |
          rate(securescore_scans_total[10m]) == 0
        for: 15m
        labels:
          severity: warning
          team: product
        annotations:
          summary: "No scans recorded in the last 15 minutes"
          description: >
            The scan counter has not incremented for 15 minutes. This may
            indicate that the scanning pipeline is blocked or that clients
            cannot reach the API.

  # ---------------------------------------------------------------------------
  # 3. Security & business health
  # ---------------------------------------------------------------------------
  - name: securescore.security
    rules:

      - alert: ProjectScoreCritical
        expr: securescore_project_health_score < 40
        for: 0m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Project {{ $labels.project_name }} has a CRITICAL health score"
          description: >
            Project "{{ $labels.project_name }}" (id: {{ $labels.project_id }})
            has a health score of {{ $value }}, which is below the CRITICAL
            threshold of 40. Immediate remediation is required.

      - alert: AuthenticationFailureSpike
        expr: |
          rate(securescore_auth_attempts_total{outcome="failure"}[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Authentication failure rate is elevated"
          description: >
            Failed authentication attempts are occurring at more than
            0.5 per second (averaged over 5 minutes). This may indicate
            a credential-stuffing or brute-force attack.
            Current rate: {{ $value | humanize }} failures/s.

      - alert: OpenVulnerabilitiesHigh
        expr: securescore_vulnerabilities_open{severity="critical"} > 0
        for: 0m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Open critical vulnerabilities detected"
          description: >
            {{ $value }} critical-severity vulnerabilities are currently open
            across one or more projects. These should be remediated immediately.

      - alert: AlertsBacklogGrowing
        expr: |
          increase(securescore_alerts_total[1h]) > 20
        for: 0m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Unusual number of security alerts in the last hour"
          description: >
            {{ $value }} new security alerts were raised in the last hour.
            Review the alert queue for a potential incident.
