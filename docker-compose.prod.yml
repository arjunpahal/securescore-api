# =============================================================================
# SecureScore — production stack deployed by the Jenkins Release stage.
#
# DIFFERENCES FROM STAGING
# ------------------------
# - Runs on port 8081 so it coexists with staging (3100) and Jenkins (8080).
#   Having both environments live at once is what makes the promotion from
#   staging to production demonstrable rather than a claim.
# - Pinned to RELEASE_VERSION with no default. The release must name the exact
#   version it is promoting; there is no :latest to accidentally deploy.
# - Resource limits and log rotation, so a runaway process cannot exhaust the
#   host.
# - Stricter runtime posture: warn-level logging and a lower rate limit.
#
# Deployed with:
#   RELEASE_VERSION=1.0.42 docker compose -p securescore-prod \
#     -f docker-compose.prod.yml up -d
#
# Rolled back by redeploying the previous version tag — the images are
# retained locally, so rollback is a redeploy, not a rebuild.
# =============================================================================

services:

  postgres:
    image: securescore-db:${RELEASE_VERSION:?RELEASE_VERSION must be set}
    container_name: securescore-db-prod
    restart: always
    environment:
      POSTGRES_DB: securescore
      POSTGRES_USER: securescore
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prod_placeholder_password}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securescore -d securescore"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [securescore-prod]

  api:
    image: securescore-api:${RELEASE_VERSION:?RELEASE_VERSION must be set}
    container_name: securescore-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: ${RELEASE_VERSION}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: securescore
      DB_USER: securescore
      DB_PASSWORD: ${DB_PASSWORD:-prod_placeholder_password}
      JWT_SECRET: ${JWT_SECRET:-prod_placeholder_jwt_secret}
      LOG_LEVEL: warn
      RATE_LIMIT_MAX: 60
    ports:
      - "${PROD_PORT:-8081}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [securescore-prod]

volumes:
  postgres_prod_data:

networks:
  securescore-prod:
    driver: bridge
