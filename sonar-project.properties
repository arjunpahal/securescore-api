# ============================================================================
# SonarQube configuration for SecureScore
# Consumed by the Code Quality stage of the Jenkins pipeline.
# ============================================================================

sonar.projectKey=securescore-api
sonar.projectName=SecureScore API
sonar.projectVersion=1.0.0

# --- Sources and tests ------------------------------------------------------
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# --- Coverage ---------------------------------------------------------------
# lcov is produced by the Test stage and imported here so SonarQube's
# quality gate can enforce a coverage threshold.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=test-results/sonar-report.xml

# --- Exclusions -------------------------------------------------------------
# Generated and vendored files are excluded so they do not distort the
# duplication and maintainability metrics.
sonar.exclusions=node_modules/**,coverage/**,test-results/**,db/migrations/**,monitoring/**,docs/**
sonar.coverage.exclusions=tests/**,src/server.js,src/config/**,db/**

# --- Duplication ------------------------------------------------------------
sonar.cpd.exclusions=tests/**

# --- Quality gate -----------------------------------------------------------
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
