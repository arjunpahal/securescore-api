# =============================================================================
# SecureScore — staging / test environment
# Used by the Deploy stage of the Jenkins pipeline.
#
#   docker compose up -d --build
#   docker compose ps
#   docker compose down -v
# =============================================================================

services:

  # --------------------------------------------------------------- database --
  postgres:
    image: postgres:16-alpine
    container_name: securescore-db-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-securescore}
      POSTGRES_USER: ${DB_USER:-securescore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securescore_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-securescore} -d ${DB_NAME:-securescore}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - securescore-net

  # ---------------------------------------------------------------- the API --
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-1.0.0}
        BUILD_NUMBER:  ${BUILD_NUMBER:-local}
        GIT_COMMIT:    ${GIT_COMMIT:-unknown}
    image: securescore-api:${BUILD_VERSION:-latest}
    container_name: securescore-api-staging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      PORT: 3000
      APP_VERSION: ${BUILD_VERSION:-1.0.0}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-securescore}
      DB_USER: ${DB_USER:-securescore}
      DB_PASSWORD: ${DB_PASSWORD:-securescore_dev_password}
      JWT_SECRET: ${JWT_SECRET:-staging_jwt_secret_change_me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - securescore-net

  # ----------------------------------------------------------- Prometheus ---
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: securescore-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
    networks:
      - securescore-net

  # -------------------------------------------------------------- Grafana ---
  grafana:
    image: grafana/grafana:11.1.0
    container_name: securescore-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - securescore-net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  securescore-net:
    driver: bridge
